<text x="36" y="116" font-family="SFMono-Regular, Consolas, 'Courier New', monospace" font-size="34" font-weight="600" fill="#F5F1EA">jinmo</text>
<text x="36" y="172" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-size="26" fill="#A39A8C">A WYSIWYG Markdown editor where</text><text x="36" y="210" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-size="26" fill="#A39A8C">syntax appears under the cursor.</text>
